<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" />

  <!-- Subsurface Geological Aquifer Layer -->
  <path d="M 60 300 Q 180 280 256 300 T 452 300 L 452 440 A 64 64 0 0 1 388 452 L 124 452 A 64 64 0 0 1 60 440 Z" fill="#0c4a6e" opacity="0.85" />
  
  <!-- Aquifer Sand / Gravel Water Layer -->
  <path d="M 60 360 Q 160 345 256 360 T 452 360 L 452 440 A 64 64 0 0 1 388 452 L 124 452 A 64 64 0 0 1 60 440 Z" fill="#0284c7" opacity="0.9" />

  <!-- Water Wave Lines -->
  <path d="M 80 395 Q 160 380 256 395 T 432 395" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" />
  <path d="M 80 425 Q 160 410 256 425 T 432 425" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Depth Sonar Rings -->
  <circle cx="256" cy="200" r="160" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="200" r="110" fill="none" stroke="#7dd3fc" stroke-width="3.5" opacity="0.6" />

  <!-- Borehole Sounding Gauge Line -->
  <line x1="256" y1="210" x2="256" y2="440" stroke="#ffffff" stroke-width="4.5" stroke-dasharray="12 6" />
  <line x1="240" y1="300" x2="272" y2="300" stroke="#ffffff" stroke-width="4" />
  <line x1="244" y1="360" x2="268" y2="360" stroke="#ffffff" stroke-width="4" />
  <line x1="236" y1="420" x2="276" y2="420" stroke="#ffffff" stroke-width="4" />

  <!-- Groundwater Droplet Icon -->
  <path d="M 256 80 C 256 80 160 210 160 260 C 160 313.02 202.98 356 256 356 C 309.02 356 352 313.02 352 260 C 352 210 256 80 256 80 Z" 
        fill="url(#dropGrad)" 
        stroke="#e0f2fe" 
        stroke-width="5" 
        filter="url(#glow)" />

  <!-- Inner Purity Hydro-Core (Emerald green) -->
  <path d="M 256 140 C 256 140 190 230 190 265 C 190 301.45 219.55 331 256 331 C 292.45 331 322 301.45 322 265 C 322 230 256 140 256 140 Z" 
        fill="url(#emeraldGrad)" />

  <!-- Highlight Reflection -->
  <ellipse cx="225" cy="225" rx="14" ry="24" transform="rotate(-30 225 225)" fill="#ffffff" opacity="0.75" />
</svg>
